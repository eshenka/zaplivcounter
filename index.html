<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счетчик заплывов</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Счетчик участников заплывов</h1>
        
        <div class="input-section">
            <label for="eventData">Отчёты:</label>
            <textarea id="eventData" placeholder="Заплывчииииик"></textarea>
            <div class="controls">
                <button id="processBtn">Обработать данные</button>
                <button id="clearBtn">Очистить</button>
                <div class="checkbox-container">
                    <input type="checkbox" id="activityWeek" name="activityWeek">
                </div>
            </div>
        </div>

        <div class="results-section">
            <h2>Результат:</h2>
            <div class="table-container">
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <th>Имена</th>
                            <th>Сбор заплыва</th>
                            <th>Посещение заплыва</th>
                            <th>Сбор котячьего заплыва</th>
                            <th>Число котят</th>
                            <th>Посещение котячьего заплыва</th>
                            <th>ИС</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="reports-section" style="margin-top: 30px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h2>Отчёты:</h2>
            <div class="reports-container" style="background: #f8f9fa; padding: 20px; border-radius: 8px; max-height: 300px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 14px; white-space: pre-wrap; word-wrap: break-word;">
                <div id="reportsContent" style="color: #2c3e50;">Нет обработанных отчётов</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
